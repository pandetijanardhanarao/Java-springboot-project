```properties
# Server Configuration
server.port=8084

# Actuator Configuration
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
management.health.db.enabled=true

# RDS MySQL Database Configuration
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:database-1.c6tgkqiqmm1r.us-east-1.rds.amazonaws.com}:3306/datastore?createDatabaseIfNotExist=true
spring.datasource.username=${MYSQL_USERNAME:admin}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-test-query=SELECT 1

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=false

# SQL Initialization
spring.sql.init.mode=never

# Application Logging
logging.file.name=${LOG_FILE_PATH:/var/log/app/datastore.log}

# CloudWatch Metrics Configuration
management.metrics.export.cloudwatch.namespace=datastoreapp
management.metrics.export.cloudwatch.enabled=true
management.metrics.export.cloudwatch.step=1m
management.metrics.export.cloudwatch.region=us-east-1

# Debug Logging
logging.level.io.micrometer=DEBUG
logging.level.software.amazon.awssdk=DEBUG
```
